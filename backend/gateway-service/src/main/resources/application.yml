server:
  port: 10003

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: localhost:${spring.application.instance_id:${server.port}}
    hostname: localhost
    prefer-ip-address: false
    non-secure-port: 10003

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  issuer: sodam
  secret: ${JWT_SECRET}
  access-expiration: 900
  refresh-expiration: 86400
