server:
  port: 10003

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: localhost:${spring.application.instance_id:${server.port}}
    hostname: localhost
    prefer-ip-address: false
    non-secure-port: 10003

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

jwt:
  issuer: sodam
  secret: "yF3y4uLhH7zJv8GkM0x1N6oPq2b5r9TfW4c7e0d3s5a8pA9B8C5E7F9G2I4J6L8M0N2P4Q6R8S0T2U4V6W8X0Y2Z4A6B8C0D3E5F7H9J2K4L6M8N0P2R4S6T8U0V2W4X6Y8Z0"
  access-expiration: 900
  refresh-expiration: 86400

logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: TRACE
  pattern:
    level: "%5p [${spring.application.name}, traceId=%X{traceId}, spanId=%X{spanId}]"
