server:
  port: ${PORT:8080}

spring:
  application:
    name: sodam-app
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_schema_history
    locations: classpath:db/migration
    repair-on-migrate: true
    schemas: public

mybatis:
  mapper-locations: classpath:mapper/**/*.xml

# Supabase JWT_SECRET (Supabase 대시보드 Settings > API > JWT Secret)
jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_APP_URL:https://sodam-nine.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sodam: DEBUG
