server:
  port: 10005

spring:
  application:
    name: account-book-service
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://localhost:3310/sodam}
    username: ${DB_USERNAME:sodam}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_schema_history_account_book_service
    locations: classpath:db/migration
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    instance-id: localhost:${spring.application.instance_id:${server.port}}
    hostname: account-book-service
    prefer-ip-address: true
    non-secure-port: 10005
