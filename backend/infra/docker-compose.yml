version: '3.8'
name: sodam
services:
  db:
    image: mariadb:11.7.2
    container_name: maria-db
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sodam}
      MYSQL_USER: ${DB_USERNAME:-sodam}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - maria-db:/var/lib/mysql
    networks:
      - spring-network

  eureka-server:
    build:
      context: ../eureka-server/
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - spring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  transaction-service:
    build:
      context: ../transaction-service/
      dockerfile: Dockerfile
    container_name: transaction-service
    depends_on:
      - eureka-server
    ports:
      - "10001:10001"
    networks:
      - spring-network
    environment:
      DB_URL: jdbc:mariadb://db:3306/${MYSQL_DATABASE:-sodam}
      DB_USERNAME: ${DB_USERNAME:-sodam}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: ../user-service/
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      - eureka-server
    ports:
      - "10002:10002"
    networks:
      - spring-network
    environment:
      DB_URL: jdbc:mariadb://db:3306/${MYSQL_DATABASE:-sodam}
      DB_USERNAME: ${DB_USERNAME:-sodam}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://junguk7880.site/login/oauth2/code/google}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-https://junguk7880.site/login/oauth2/code/kakao}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-service:
    build:
      context: ../gateway-service/
      dockerfile: Dockerfile
    container_name: gateway-service
    depends_on:
      - eureka-server
    ports:
      - "10003:10003"
    networks:
      - spring-network
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  category-service:
    build:
      context: ../category-service/
      dockerfile: Dockerfile
    container_name: category-service
    depends_on:
      - eureka-server
    ports:
      - "10004:10004"
    networks:
      - spring-network
    environment:
      DB_URL: jdbc:mariadb://db:3306/${MYSQL_DATABASE:-sodam}
      DB_USERNAME: ${DB_USERNAME:-sodam}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  account-book-service:
    build:
      context: ../account-book-service/
      dockerfile: Dockerfile
    container_name: account-book-service
    depends_on:
      - eureka-server
    ports:
      - "10005:10005"
    networks:
      - spring-network
    environment:
      DB_URL: jdbc:mariadb://db:3306/${MYSQL_DATABASE:-sodam}
      DB_USERNAME: ${DB_USERNAME:-sodam}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  maria-db: 

networks:
  spring-network:
    driver: bridge
